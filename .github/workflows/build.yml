# Builds the desktop app and the Android app on every push / pull request.
# Produces: Linux .deb, Windows .zip, macOS (Apple Silicon) .dmg and Android APKs, as artifacts of the run.
# On tags, the Android APK is attached to the GitHub release (desktop installers for releases are built by release-*.yml).

name: Build desktop & Android

on:
  push:
    branches: [ main, dev, 'android-*' ]
    tags: [ "*" ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        run: echo "VERSION=$(awk -F'=' '/^app.version/ {print $2}' gradle.properties | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Package (Linux .deb)
        if: matrix.name == 'linux'
        run: |
          chmod +x gradlew
          ./gradlew packageDeb
          mkdir -p dist
          cp build/compose/binaries/main/deb/*.deb "dist/vlabeler-$VERSION-amd64.deb"

      - name: Package (Windows .zip)
        if: matrix.name == 'windows'
        run: |
          ./gradlew createDistributable
          mkdir -p dist
          pwsh -Command "Compress-Archive ./build/compose/binaries/main/app/vLabeler/* ./dist/vlabeler-$VERSION-win64.zip"

      # Not signed / notarized: on first launch use right click -> Open (or allow it in Privacy & Security)
      - name: Package (macOS .dmg)
        if: matrix.name == 'mac-arm64'
        run: |
          chmod +x gradlew
          ./gradlew packageDmg
          mkdir -p dist
          cp build/compose/binaries/main/dmg/*.dmg "dist/vlabeler-$VERSION-mac-arm64.dmg"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: vlabeler-desktop-${{ matrix.name }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub-hosted Ubuntu runners already have the Android SDK (ANDROID_HOME). The action is only needed on
      # runners without it, so a failure there must not stop the build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK not found"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug

      - name: Rename APKs
        run: |
          VERSION=$(awk -F'=' '/^app.version/ {print $2}' gradle.properties)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/vlabeler-$VERSION-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/vlabeler-$VERSION-android-debug.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: vlabeler-android
          path: dist/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/vlabeler-*-android.apk
